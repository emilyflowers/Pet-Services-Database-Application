<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Pet</title>
    <!-- Link external CSS here -->
    <link rel="stylesheet" href="style.css"> 
    <h1 class="header">Add New Pet</h1> 
</head>

<body>
        <div class="main-body">
        <div class="home-main-content"> 
        <h3>Please complete all fields:</h3>
        <form action="addpet.php" method="POST">
            <label for="pet-name">Pet Name:</label>
            <input type="text" id="pet-name" name="pet-name" required><br><br>
            <label for="client-name">Pet Parent (oid #):</label>
            <input type="text" id="client-name" name="client-name" required><br><br>
            <label for="species">Species:</label>
            <input type="text" id="species" name="species" required><br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>
            <label for="is-fixed">Is the pet fixed (spayed/neutered)?</label>
            <input type="checkbox" id="is-fixed" name="is-fixed" value="1"><br><br>
            <label for="is-vaccinated">Is the pet up-to-date on their vaccinations?</label>
            <input type="checkbox" id="is-vaccinated" name="is-vaccinated" value="1"><br><br>
            <button type="submit">Add Pet</button>
        </form>
        </div>
    </div>
</body>
<footer>
</footer>
</html>
