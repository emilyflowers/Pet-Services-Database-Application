<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Pet</title>
    <!-- Link external CSS here -->
    <link rel="stylesheet" href="style.css"> 
    <h1 class="header">Add New Pet</h1> 
</head>

<body>
        <div class="main-body">
        <div class="home-main-content"> 
        <h3>Please complete all fields:</h3>
        <form>
            <label for="pet-name">Pet Name:</label>
            <input type="text" id="pet-name" name="pet-name" required><br><br>
            <label for="client-name">Pet Parent Name:</label>
            <input type="client-name" id="client-name" name="client-name" required><br><br>
            <label for="species">Species:</label>
            <input type="species" id="species" name="species" required><br><br>
            <label for="dob">Date of Birth:</label>
            <input type="dob" id="dob" name="dob" required><br><br>
            <button type="submit">Add User</button>
        </form>
        </div>
    </div>
        <!-- Link external JavaScript here -->
    <script src="script.js"></script>
</body>
<footer>
</footer>
</html>
